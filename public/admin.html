<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Himwiita Nkosilati — Admin V4.1</title><style>
:root{--gold:#d7a92d;--bg:#080a0b;--panel:#121617;--line:#2b3031;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}header{padding:20px 6%;background:#111516;border-bottom:1px solid #d7a92d44;display:flex;justify-content:space-between;align-items:center}a{color:#e8bf52;text-decoration:none}.wrap{max-width:1150px;margin:35px auto;padding:0 20px}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:20px}input,textarea,select{width:100%;padding:12px;background:#080a0b;border:1px solid #444;color:#fff;border-radius:6px;margin:7px 0 15px}button{background:var(--gold);color:#111;border:0;padding:11px 16px;border-radius:5px;font-weight:bold;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:#242829;color:#fff}.tabs button.active{background:var(--gold);color:#111}.item{border:1px solid #2a2e2f;padding:14px;border-radius:7px;margin:8px 0;overflow:auto}.danger{float:right;background:#722020;color:#fff}.msg{color:#e8bd50;margin-top:10px}.hide{display:none}.hint{color:#999;font-size:12px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0b0d0e;border:1px solid #2a2e2f;padding:18px;border-radius:8px}.stat b{font-size:25px;display:block;margin-top:5px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><header><b>♫ HIMWIITA NKOSILATI — ADMIN V4.1</b><a href="/">PUBLIC SITE</a></header><div class="wrap">
<div id="login" class="box"><h2>Admin Login</h2><p class="hint">Use the ADMIN_USER and ADMIN_PASS values configured on your server. For the first local test, the default is admin / nkosilati1.</p><input id="u" value="admin" placeholder="Username"><input id="p" type="password" value="nkosilati1" placeholder="Password"><button onclick="login()">LOGIN</button><div id="lm" class="msg"></div></div>
<div id="app" class="hide"><div id="stats" class="stats"></div><br><div class="tabs"><button class="active" onclick="showForm('song',this)">UPLOAD SONG</button><button onclick="showForm('album',this)">NEW ALBUM</button><button onclick="showForm('video',this)">UPLOAD VIDEO</button><button onclick="showForm('lyrics',this)">ADD LYRICS</button><button onclick="library()">LIBRARY</button><button onclick="logout()">LOG OUT</button></div><div id="area"></div></div></div>
<script>
let current={albums:[],songs:[],videos:[],lyrics:[]};
const F={song:`<div class="box"><h2>Upload Song</h2><input id="title" placeholder="Song title"><input id="album" value="Tushoma Ndiwe" placeholder="Album"><input id="genre" value="Gospel"><input id="track" type="number" min="0" placeholder="Track number (optional)"><input id="file" type="file" accept="audio/*"><button onclick="up('song')">UPLOAD SONG</button></div>`,album:`<div class="box"><h2>Create Album</h2><input id="title" placeholder="Album title"><textarea id="description" placeholder="Description"></textarea><input id="file" type="file" accept="image/*"><button onclick="up('cover')">CREATE ALBUM</button></div>`,video:`<div class="box"><h2>Upload Video</h2><input id="title" placeholder="Video title"><textarea id="description" placeholder="Description"></textarea><input id="file" type="file" accept="video/*"><button onclick="up('video')">UPLOAD VIDEO</button></div>`,lyrics:`<div class="box"><h2>Add Lyrics</h2><input id="title" placeholder="Song title"><textarea id="text" rows="18" placeholder="Paste lyrics here"></textarea><button onclick="up('lyrics')">SAVE LYRICS</button></div>`};
function showForm(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');area.innerHTML=F[t]}
async function login(){lm.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),j=await r.json();if(!r.ok)throw Error(j.error);loginBox(false);await refresh();showForm('song',document.querySelector('.tabs button'))}catch(e){lm.textContent=e.message}}
function loginBox(show){document.getElementById('login').classList.toggle('hide',!show);document.getElementById('app').classList.toggle('hide',show)}
async function refresh(){current=await(await fetch('/api/content')).json();stats.innerHTML=[['Songs',current.songs.length],['Albums',current.albums.length],['Videos',current.videos.length],['Lyrics',current.lyrics.length]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}
async function up(type){const fd=new FormData();fd.append('type',type);['title','album','genre','description','text','track'].forEach(k=>{const e=document.getElementById(k);if(e)fd.append(k,e.value)});const f=document.getElementById('file');if(f?.files[0])fd.append('file',f.files[0]);try{const r=await fetch('/api/upload',{method:'POST',body:fd});let j={};try{j=await r.json()}catch{j={error:'Server returned an invalid response. Check Render logs.'}}if(!r.ok)throw Error(j.error||('Upload failed ('+r.status+')'));if(j.warning)alert('Saved, but with a warning:

'+j.warning);else alert('Saved successfully.');await refresh();library()}catch(e){alert('Upload error:

'+e.message+'

If this says “Failed to fetch”, open Render → Logs and check the latest error. V4.1 also keeps the starter songs playable without Supabase Storage.')}}
async function library(){await refresh();let o='<div class="box"><h2>Library</h2>';for(const [k,label,t] of [['albums','ALBUMS','album'],['songs','SONGS','song'],['videos','VIDEOS','video'],['lyrics','LYRICS','lyric']]){o+=`<h3>${label} (${current[k].length})</h3>`;current[k].forEach(x=>{const name=x.title||x.song;const extra=k==='songs'?` — ${x.plays||0} plays`:'';o+=`<div class="item"><b>${esc(name)}</b>${extra}<button class="danger" onclick="del('${t}','${x.id}')">DELETE</button></div>`})}area.innerHTML=o+'</div>'}
async function del(t,id){if(!confirm('Delete this item permanently?'))return;const r=await fetch('/api/delete/'+t+'/'+id,{method:'POST'}),j=await r.json();if(!r.ok)return alert(j.error);await refresh();library()}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{const m=await(await fetch('/api/me')).json();if(m.loggedIn){loginBox(false);await refresh();showForm('song',document.querySelector('.tabs button'))}})();
</script></body></html>
